[project]
name = "opnsense-backup"
version = "0.2.0"
description = "Download current and historical OPNsense config backups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opnsense-backup = "opnsense_backup.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
